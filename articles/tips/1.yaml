version: 0.5
loop:
  count: 5
nodes:
  history:
    value: []
    update: ":nextHistory.array"
  messageData:
    agent: "stringTemplateAgent"
    inputs: ["hello", "how are you?"]
    params:
      template:
        - role: "user"
          content: "${0}"
        - role: "assistant"
          content: "${1}"
  nextHistory:
    agent: "arrayFlatAgent"
    inputs: {array: [:history, :messageData]}
    console:
      after: true
  
